<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 - 我的博客</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-text">我的博客</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">首页</a></li>
                <li><a href="index.html#articles" class="nav-link active">文章</a></li>
                <li><a href="index.html#about" class="nav-link">关于我</a></li>
                <li><a href="index.html#contact" class="nav-link">联系</a></li>
            </ul>
            <button class="menu-toggle" aria-label="菜单开关">
                <span class="menu-icon"></span>
            </button>
        </div>
    </nav>

    <!-- 文章内容 -->
    <main class="post">
        <div class="container">
            <article class="post-content">
                <!-- 文章头部 -->
                <header class="post-header">
                    <h1 class="post-title" id="post-title">加载中...</h1>
                </header>

                <!-- 文章正文 -->
                <div class="post-body" id="post-content">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                    </div>
                </div>

                <!-- 文章底部 -->
                <footer class="post-footer">
                    <div class="post-share">
                        <h3>分享文章</h3>
                        <div class="share-links">
                            <a href="#" class="share-link">微信</a>
                            <a href="#" class="share-link">微博</a>
                            <a href="#" class="share-link">知乎</a>
                            <a href="#" class="share-link">GitHub</a>
                        </div>
                    </div>
                </footer>
            </article>

            <!-- 文章导航 -->
            <nav class="post-nav">
                <div class="post-nav-item prev">
                    <a href="#" class="post-nav-link">
                        <span class="nav-label">上一篇</span>
                        <span class="nav-title">没有了</span>
                    </a>
                </div>
                <div class="post-nav-item next">
                    <a href="#" class="post-nav-link">
                        <span class="nav-label">下一篇</span>
                        <span class="nav-title">没有了</span>
                    </a>
                </div>
            </nav>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <h3 class="footer-logo">我的博客</h3>
                    <p class="footer-description">记录技术与思考，分享成长与感悟</p>
                </div>
                <div class="footer-links">
                    <h4 class="footer-links-title">快速链接</h4>
                    <ul class="footer-links-list">
                        <li><a href="index.html" class="footer-link">首页</a></li>
                        <li><a href="index.html#articles" class="footer-link">文章</a></li>
                        <li><a href="index.html#about" class="footer-link">关于我</a></li>
                        <li><a href="index.html#contact" class="footer-link">联系</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p class="footer-copyright">© 2025 我的博客. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/post.js"></script>
</body>
</html>
