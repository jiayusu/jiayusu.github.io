<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 - 我的博客</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 仅保留最基本的样式 */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            color: #333;
        }
        h1, h2, h3 {
            margin-top: 30px;
        }
        pre {
            background-color: #f0f0f0;
            padding: 10px;
            overflow-x: auto;
            border-radius: 3px;
        }
        code {
            background-color: #f0f0f0;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: monospace;
        }
        blockquote {
            border-left: 3px solid #ccc;
            margin-left: 0;
            padding-left: 20px;
            color: #666;
        }
        a {
            color: #0366d6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .help {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 12px;
            color: #666;
        }
        .back-link {
            margin-bottom: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <!-- 返回链接 -->
    <a href="index.html" class="back-link">← 返回首页</a>
    
    <!-- 文章内容 -->
    <article id="post">
        <h1 id="post-title">加载中...</h1>
        <div id="post-content">正在加载文章...</div>
    </article>
    
    <!-- 帮助信息 -->
    <div class="help">
        快捷键: ? 显示帮助, H 首页, A 文章列表, P 个人介绍, ↑/↓ 导航, Q 退出
    </div>
    
    <!-- 脚本 -->
    <script src="assets/js/posts-data.js"></script>
    <script src="assets/js/post.js"></script>
    <script src="assets/js/keyboard.js"></script>
</body>
</html>
