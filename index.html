---
layout: default
title: Su Jiayu 的工作笔记
---

<article class="note note--index">
  <div class="note-content">
    {% assign concept_notes = site.notes | sort: 'title' %}
    <ul class="concept-index">
      {% for note in concept_notes %}
      <li>
        <a href="{{ note.url | relative_url }}">{{ note.title }}</a>
        {% if note.summary %}<span>{{ note.summary }}</span>{% endif %}
      </li>
      {% endfor %}
    </ul>

  </div>
</article>
