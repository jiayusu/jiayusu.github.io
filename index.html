---
layout: default
title: 首页
---

<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a>
    <div class="post-meta">
      {{ post.date | date: '%Y-%m-%d' }}
    </div>
  </li>
  {% endfor %}
</ul>

{% if site.posts.size == 0 %}
<p>暂无文章</p>
{% endif %}
