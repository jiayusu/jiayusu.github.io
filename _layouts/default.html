<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/notes.css' | relative_url }}">
</head>
<body>
  <main class="note-space" id="note-space" aria-label="笔记浏览区">
    <div class="note-track" id="note-track">
      <section class="note-column" data-note-column data-note-url="{{ page.url | relative_url }}" data-note-title="{{ page.title | default: site.title | escape }}">
        <div class="note-spine" aria-hidden="true">{{ page.title | default: site.title }}</div>
        <div class="note-column__body">
          {{ content }}
        </div>
      </section>
    </div>
  </main>
  <div class="loading-note" id="loading-note" role="status" aria-live="polite">正在打开笔记…</div>
  <aside class="note-preview" id="note-preview" hidden aria-hidden="true"></aside>
  <script src="{{ '/assets/js/notes.js' | relative_url }}"></script>
</body>
</html>
