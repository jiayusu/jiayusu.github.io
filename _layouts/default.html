<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/notes.css' | relative_url }}">
</head>
<body>
  <main class="note-space" id="note-space" aria-label="笔记浏览区">
    <section class="note-column" data-note-column data-note-url="{{ page.url | relative_url }}">
      <div class="note-column__bar">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <button class="close-note" type="button" aria-label="关闭这篇笔记">×</button>
      </div>
      <div class="note-column__body">
        {{ content }}
      </div>
    </section>
  </main>
  <div class="loading-note" id="loading-note" role="status" aria-live="polite">正在打开笔记…</div>
  <script src="{{ '/assets/js/notes.js' | relative_url }}"></script>
</body>
</html>
