---
layout: default
---
<article class="note">
  <header class="note-header">
    <p class="note-kicker">概念笔记 · {{ page.topic }} · {{ page.status }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="note-summary">{{ page.summary }}</p>{% endif %}
  </header>

  <div class="note-content">
    {{ content }}
  </div>
</article>
