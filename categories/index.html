---
layout: default
title: 文章分类
---

<h2>文章分类</h2>

{% assign categories = site.categories | sort %}
<ul>
  {% for category in categories %}
    <li>
      <a href="{{ site.baseurl }}/categories/{{ category[0] | slugify }}/">
        {{ category[0] }} ({{ category[1].size }})
      </a>
    </li>
  {% endfor %}
</ul>
